<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#EBF0EF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#08171C" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <title></title>
  <script src="trip.js"></script>
  <script>
    /* The title, the description and the saved theme all come from the trip
       and are stamped before first paint: a title filled in later shows the
       URL in the tab for a beat, and an explicit theme filled in later
       flashes the system one for a frame. */
    (function(){
      var m = window.TRIP.meta;
      document.title = m.title;
      document.querySelector('meta[name="description"]').content = m.description;
      try{var t=localStorage.getItem(m.id+'.theme');
        if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t);}catch(e){}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <header class="topbar">
    <div class="brand-block">
      <p class="eyebrow" id="tripSubtitle"></p>
      <h1 id="tripTitle"></h1>
      <div class="route-strip" id="tripRoute"></div>
    </div>
    <div class="topbar-actions">
      <div class="theme-switch" role="radiogroup" aria-label="外觀主題">
        <button class="theme-opt" data-theme-set="light" role="radio" aria-checked="false" aria-label="淺色"><span class="theme-ico" data-icon="sun" aria-hidden="true"></span></button>
        <button class="theme-opt" data-theme-set="system" role="radio" aria-checked="true" aria-label="跟隨系統"><span class="theme-ico" data-icon="system" aria-hidden="true"></span></button>
        <button class="theme-opt" data-theme-set="dark" role="radio" aria-checked="false" aria-label="深色"><span class="theme-ico" data-icon="moon" aria-hidden="true"></span></button>
      </div>
      <button id="installBtn" class="btn primary" hidden>安裝 App</button>
    </div>
  </header>

  <!-- tabindex -1 so the skip link can actually move focus here; without it
       the link scrolls nothing and focus stays on the link. -->
  <main id="main" tabindex="-1">
    <p id="nextStatus" class="sr-only" role="status" aria-atomic="true"></p>

    <div class="tabs" role="tablist" aria-label="主要頁籤">
      <button class="tab active" role="tab" id="tab-itinerary" aria-controls="itinerary" aria-selected="true" tabindex="0" data-view="itinerary" data-icon="route"><span class="tab-ico" aria-hidden="true"></span><span class="tab-label">行程</span></button>
      <button class="tab" role="tab" id="tab-planner" aria-controls="planner" aria-selected="false" tabindex="-1" data-view="planner" data-icon="pin"><span class="tab-ico" aria-hidden="true"></span><span class="tab-label">每日規劃</span></button>
      <button class="tab" role="tab" id="tab-todos" aria-controls="todos" aria-selected="false" tabindex="-1" data-view="todos" data-icon="check"><span class="tab-ico" aria-hidden="true"></span><span class="tab-label">待辦</span></button>
      <button class="tab" role="tab" id="tab-costs" aria-controls="costs" aria-selected="false" tabindex="-1" data-view="costs" data-icon="wallet"><span class="tab-ico" aria-hidden="true"></span><span class="tab-label">費用</span></button>
    </div>

    <section id="itinerary" class="view active" role="tabpanel" aria-labelledby="tab-itinerary" tabindex="0">
      <section id="nowPanel" class="now-panel" aria-label="下一個行程">
        <div class="now-head">
          <span class="now-kicker">下一個行程</span>
          <span id="clockText" class="clock num"></span>
        </div>
        <div class="now-main">
          <span class="now-icon" id="nextIcon" aria-hidden="true"></span>
          <div class="now-text">
            <h2 id="nextTitle">載入中…</h2>
            <p id="nextMeta">—</p>
          </div>
          <div class="now-count">
            <div class="countdown num" id="nextCountdown">—</div>
            <div class="count-label num" id="nextAt">—</div>
          </div>
        </div>
        <div class="now-bar" aria-hidden="true"><i id="nowBar"></i></div>
        <div class="now-actions">
          <button class="btn on-dark" id="jumpNextBtn">查看行程</button>
          <span class="now-hint" id="nextHint"></span>
        </div>
      </section>

      <div class="section-head">
        <div><h2>固定時間軸</h2><p id="timelineNote"></p></div>
      </div>
      <div class="day-strip" id="dayStrip" role="group" aria-label="篩選日期"></div>
      <div id="timeline" class="timeline"></div>
    </section>

    <section id="planner" class="view" role="tabpanel" aria-labelledby="tab-planner" tabindex="0">
      <div class="section-head">
        <div><h2>每日規劃</h2><p>可加入景點、餐廳、集合與交通；資料只存在此裝置。</p></div>
        <button id="addPlanBtn" class="btn primary">＋ 新增</button>
      </div>
      <div class="day-strip" id="planDayStrip" role="group" aria-label="規劃日期"></div>
      <div id="planList" class="stack grouped"></div>
      <div id="planEmpty" class="empty-state" hidden>
        <span class="empty-icon" data-icon="pin" aria-hidden="true"></span>
        <strong>這天還沒有自訂行程</strong>
        <span>把餐廳、景點或集合時間加進來，就會和固定交通一起排序。</span>
      </div>
    </section>

    <section id="todos" class="view" role="tabpanel" aria-labelledby="tab-todos" tabindex="0">
      <div class="section-head">
        <div><h2>出發前待辦</h2><p>勾選狀態會保存在此裝置。</p></div>
      </div>
      <div class="progress-card">
        <svg class="ring" viewBox="0 0 76 76" aria-hidden="true">
          <circle class="ring-bg" cx="38" cy="38" r="31"></circle>
          <circle class="ring-fg" id="todoRing" cx="38" cy="38" r="31"></circle>
        </svg>
        <div class="progress-meta">
          <strong class="num" id="todoPercent">0%</strong>
          <span id="todoProgressText">0 / 0 完成</span>
          <span class="progress-note" id="todoNext">—</span>
        </div>
        <button id="resetTodos" class="btn quiet">重設</button>
      </div>
      <div id="todoList" class="stack grouped"></div>
    </section>

    <section id="costs" class="view" role="tabpanel" aria-labelledby="tab-costs" tabindex="0">
      <div class="section-head"><div><h2>固定費用</h2><p>未含高鐵、機捷、市內交通、餐食、景點與保險。</p></div></div>
      <div id="costSummary" class="cost-summary"></div>
      <div id="costChart" class="cost-chart"></div>
      <div class="table-wrap"><table><thead><tr><th>項目</th><th>占比</th><th>含費總額</th><th>每人參考</th></tr></thead><tbody id="costTable"></tbody></table></div>
    </section>
  </main>

  <button id="addPlanFab" class="fab" data-icon="plus" aria-label="新增行程"></button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <aside id="criticalBanner" class="critical-banner">
    <span class="cb-icon" data-icon="alert" aria-hidden="true"></span>
    <div class="cb-text">
      <strong id="alertTitle"></strong>
      <span id="alertText"></span>
    </div>
    <button id="dismissBanner" class="cb-close" aria-label="關閉提醒">×</button>
  </aside>

  <footer>
    <span id="checkedOn"></span>
    <button id="sourceBtn" class="link-btn">查看資料來源</button>
  </footer>

  <dialog id="planDialog">
    <form id="planForm" method="dialog">
      <div class="dialog-head"><h2 id="planDialogTitle">新增行程</h2><button type="button" id="closePlan" aria-label="關閉">×</button></div>
      <div class="form-grid">
        <label>日期<select id="planDate" required></select></label>
        <label>時間<input id="planTime" type="time" required /></label>
        <label class="full">名稱<input id="planTitle" type="text" maxlength="60" placeholder="例如：亞羅街晚餐" required /></label>
        <label>類型<select id="planType"></select></label>
        <label>預估時間<input id="planDuration" type="text" maxlength="30" placeholder="例如 90 分鐘" /></label>
        <label class="full">地點 / 備註<textarea id="planNote" rows="3" maxlength="220" placeholder="地址、訂位資訊、集合點或提醒"></textarea></label>
      </div>
      <div class="dialog-actions"><button type="button" class="btn quiet" id="cancelPlan">取消</button><button class="btn primary" value="default">儲存</button></div>
    </form>
  </dialog>

  <dialog id="sourceDialog">
    <div class="dialog-head"><h2>資料來源</h2><button id="closeSources" aria-label="關閉">×</button></div>
    <div id="sourceList" class="source-list"></div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
